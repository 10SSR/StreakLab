<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streak Lab - Offline Mode</title>
  <style>
    body {
      background-color: #070913;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 420px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    .icon {
      font-size: 54px;
      margin-bottom: 16px;
      animation: pulse 2s infinite ease-in-out;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>You're in Offline Lab Mode</h1>
    <p>Streak Lab keeps your habits, check-ins, and streak points safely stored in your local IndexedDB. Your actions will sync automatically once reconnected.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
